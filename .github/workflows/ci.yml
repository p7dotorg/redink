name: CI

# Smoke test: o redink não tem suíte de testes (ver CONTRIBUTING). Isto garante que o
# workspace instala pelo lockfile, que tudo compila e que os grafos importam sem chave.
# Não roda pipeline nem eval/ (são pagos e BYOK).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Instalar (lockfile)
        run: uv sync --frozen
      - name: Compilar
        run: uv run python -m compileall -q core cli eval
      - name: Importar grafos e CLIs (sem chaves no ambiente)
        run: |
          uv run python - <<'PY'
          import importlib
          for m in ["redink_core.graph", "redink_core.drl.graph", "redink_cli.app", "redink_cli.drl_app"]:
              importlib.import_module(m)
              print("ok", m)
          PY
